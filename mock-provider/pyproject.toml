[project]
name = "async-payment-mock-provider"
version = "0.1.0"
description = "Mock external payment provider for async-payment-processing"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi (>=0.141,<0.142)",
    "pydantic (>=2.13,<3.0)",
    "uvicorn[standard] (>=0.53,<0.54)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
httpx = "^0.28"
pytest = "^9.1"
pytest-asyncio = "^1.4"
ruff = "^0.16.9"
pyright = "^1.1.414"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
